controller:
  admin:
    username: admin
    #password: ChangeThisPasswordLater123!

  serviceType: ClusterIP

  ingress:
    enabled: true
    apiVersion: networking.k8s.io/v1
    ingressClassName: nginx
    hostName: jenkins.brianbargholz.ca
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: jenkins-brianbargholz-ca-tls
        hosts:
          - jenkins.brianbargholz.ca

persistence:
  enabled: true
  size: 8Gi