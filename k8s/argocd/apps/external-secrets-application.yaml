apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2

    helm:
      skipCrds: true

      values: |
        serviceAccount:
          create: true
          name: external-secrets

          annotations:
            azure.workload.identity/client-id: "905ff625-8adf-4eb6-80aa-c0f1dd9015b7"

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true