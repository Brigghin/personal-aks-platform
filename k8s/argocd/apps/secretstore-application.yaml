apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secretstore
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Brigghin/personal-aks-platform.git
    targetRevision: HEAD
    path: k8s/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true