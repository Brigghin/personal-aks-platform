apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: personal-website
  name: jenkins-deployer
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list
  - watch

- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
  - patch
  - update